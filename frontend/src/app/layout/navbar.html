<nav class="navbar animation-page" [class.scrolled]="scrolled()">
  <a [routerLink]="auth.isLoggedIn() ? '/main' : '/signin'">
    <img src="assets/images/banner.png" class="img-logo" alt="CDG" />
  </a>

  @if (auth.user(); as user) {
    <div class="main-list">
      <mat-card appearance="outlined" class="card-nav">
        <mat-card-header>
          <div mat-card-avatar class="user-nav-image"></div>
          <mat-card-title class="user-text">{{ user.firstname }} {{ user.lastname }}</mat-card-title>
          <mat-card-subtitle class="user-text">รหัสพนักงาน {{ user.employeeNo }}</mat-card-subtitle>
        </mat-card-header>
      </mat-card>
      <button
        type="button"
        class="signout-btn"
        (click)="signOut()"
        matTooltip="ออกจากระบบ"
        matTooltipClass="tooltip-primary"
        aria-label="ออกจากระบบ"
      >
        <mat-icon>logout</mat-icon>
      </button>
    </div>

    <!-- Small screens: hamburger menu instead of the user card. -->
    <button type="button" class="nav-trigger" [matMenuTriggerFor]="mobileMenu" aria-label="เมนู">
      <i></i><i></i><i></i>
    </button>
    <mat-menu #mobileMenu="matMenu">
      <div class="menu-responsive">
        {{ user.firstname }} {{ user.lastname }}<br />
        รหัสพนักงาน {{ user.employeeNo }}
      </div>
      <button mat-menu-item type="button" (click)="signOut()"><mat-icon>logout</mat-icon> ออกจากระบบ</button>
    </mat-menu>
  }
</nav>
<div class="navbar-spacer"></div>
