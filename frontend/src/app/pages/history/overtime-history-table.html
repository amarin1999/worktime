<mat-form-field appearance="outline" class="search">
  <mat-label><mat-icon>search</mat-icon> ค้นหา...</mat-label>
  <input matInput (keyup)="applyFilter($event)" />
</mat-form-field>

<table mat-table matSort [dataSource]="source" class="mat-elevation-z8 history-table">
  <ng-container matColumnDef="projectNo">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>
      <mat-icon>apps</mat-icon><span class="head-text">&nbsp;รหัสโครงการ</span>
    </th>
    <td mat-cell *matCellDef="let e">{{ e.projectNo }}</td>
  </ng-container>

  <ng-container matColumnDef="startTime">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>
      <mat-icon>call_missed</mat-icon><span class="head-text">&nbsp;เวลาเข้างาน</span>
    </th>
    <td mat-cell *matCellDef="let e">{{ e.startTime | thaiDateTime }}</td>
  </ng-container>

  <ng-container matColumnDef="endTime">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>
      <mat-icon>call_missed_outgoing</mat-icon><span class="head-text">&nbsp;เวลาออกงาน</span>
    </th>
    <td mat-cell *matCellDef="let e">{{ e.endTime | thaiDateTime }}</td>
  </ng-container>

  <ng-container matColumnDef="remark">
    <th mat-header-cell *matHeaderCellDef>
      <mat-icon>notes</mat-icon><span class="head-text">&nbsp;หมายเหตุ</span>
    </th>
    <td mat-cell *matCellDef="let e">{{ e.remark }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: columns"
    class="row-item"
    (click)="edit.emit(row)"
    matTooltip="คลิกเพื่อแก้ไข"
    matTooltipClass="tooltip-primary"
  ></tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10, 15, 20]" showFirstLastButtons />
