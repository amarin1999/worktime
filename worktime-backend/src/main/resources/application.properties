spring.application.name=worktime-backend
server.servlet.context-path=/workTimeAPI
server.port=${PORT:8080}
# Behind a reverse proxy that terminates TLS
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# ---- Database (all values come from the environment, never commit secrets) ----
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/worktime?sslMode=verify-full}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---- Security ----
# At least 32 random bytes, e.g. `openssl rand -base64 48`
app.security.jwt-secret=${JWT_SECRET}
app.security.session-duration=8h
# Set to false only for local plain-HTTP development
app.security.secure-cookie=${COOKIE_SECURE:true}
# Comma separated employee numbers allowed to download reports
app.security.admin-employee-nos=${APP_ADMIN_EMPLOYEE_NOS:}
# Comma separated origins, leave empty when the UI is served from the same origin (recommended)
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:}
app.security.max-login-attempts=5
app.security.login-lockout=15m

# ---- CDG IS web service (login, holidays, leaves) ----
app.is-service.url=${IS_SERVICE_URL:https://cdgisweb.cdg.co.th/iswebservice/isservice.asmx}
app.is-service.timeout=15s

logging.level.root=INFO
